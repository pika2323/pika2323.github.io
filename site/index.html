<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazoçtagram | Shitpost Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
        }
        .insta-grid-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            background-color: #121212;
        }
        .insta-grid-item:hover .overlay {
            opacity: 1;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .post-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="selection:bg-pink-500">

    <!-- Üst Bar -->
    <nav class="sticky top-0 z-50 bg-black border-b border-zinc-800 py-3">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-yellow-500">NAZOÇTAGRAM</h1>
            <div class="flex items-center space-x-5">
                <i data-lucide="plus-square" class="w-6 h-6 cursor-pointer hover:text-zinc-400"></i>
                <i data-lucide="heart" class="w-6 h-6 cursor-pointer hover:text-zinc-400"></i>
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px]">
                    <div class="w-full h-full rounded-full bg-black flex items-center justify-center overflow-hidden">
                        <img src="profil.jpg" alt="P" class="post-img" onerror="this.src='https://ui-avatars.com/api/?name=Nazoc&background=random&color=fff'">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Profil Bilgileri -->
    <header class="max-w-4xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-12">
            <div class="w-24 h-24 md:w-40 md:h-40 rounded-full bg-zinc-800 flex items-center justify-center border-2 border-zinc-700 shrink-0 overflow-hidden relative group">
                <img src="profil.jpg" alt="Nazoç Profil" class="w-full h-full object-fit" style="object-fit: cover;" onerror="this.src='https://ui-avatars.com/api/?name=Nazoc&size=512&background=6366f1&color=fff'">
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </div>
            </div>
            
            <div class="flex-1 text-center md:text-left">
                <div class="flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-4 mb-6">
                    <h2 class="text-2xl font-light tracking-wide">nazoç_efoç_aytoç_offical</h2>
                    <div class="flex space-x-2">
                        <button class="bg-zinc-800 hover:bg-zinc-700 px-4 py-1.5 rounded-lg text-sm font-semibold transition">Profili Düzenle</button>
                        <button class="bg-zinc-800 hover:bg-zinc-700 px-2 py-1.5 rounded-lg transition"><i data-lucide="settings" class="w-4 h-4"></i></button>
                    </div>
                </div>
                
                <div class="flex justify-center md:justify-start space-x-8 mb-6 text-sm">
                    <div><span class="font-bold">31</span> gönderi</div>
                    <div><span class="font-bold">31k</span> takipçi</div>
                    <div><span class="font-bold">67</span> takip</div>
                </div>
                
                <div class="space-y-1">
                    <p class="font-bold">Nazoç</p>
                    <p class="text-zinc-400 italic">İYİLİK İYİDİR.</p>
                    <a href="#" class="text-blue-400 text-sm font-semibold hover:underline">https://www.instagram.com/tthe_virtuoso/</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sekmeler -->
    <div class="max-w-4xl mx-auto border-t border-zinc-800 flex justify-center space-x-12 mt-4">
        <div class="border-t border-white py-4 flex items-center space-x-2 text-xs font-bold tracking-widest uppercase cursor-pointer">
            <i data-lucide="grid" class="w-3 h-3"></i>
            <span>NAZIMLAR</span>
        </div>
        <div class="py-4 flex items-center space-x-2 text-xs font-bold tracking-widest uppercase text-zinc-500 cursor-pointer hover:text-zinc-300">
            <i data-lucide="play" class="w-3 h-3"></i>
            <span>EFELER</span>
        </div>
        <div class="py-4 flex items-center space-x-2 text-xs font-bold tracking-widest uppercase text-zinc-500 cursor-pointer hover:text-zinc-300">
            <i data-lucide="user-square" class="w-3 h-3"></i>
            <span>OÇLAR</span>
        </div>
    </div>

    <!-- Shitpost Izgarası -->
    <main class="max-w-4xl mx-auto pb-20">
        <div class="grid grid-cols-3 gap-1 md:gap-4 px-1 md:px-0">
            
            <!-- FOTOĞRAF YERİ 1 -->
            <div class="insta-grid-item" onclick="openModal('shit1.jpg', 'keşke ölsek amuagoyyum')">
                <img src="shit1.jpg" alt="Post 1" class="post-img">
                <div class="overlay">
                    <div class="flex space-x-4 text-white font-bold text-sm">
                        <span class="flex items-center"><i data-lucide="heart" class="w-4 h-4 fill-white mr-1"></i> 312</span>
                        <span class="flex items-center"><i data-lucide="message-circle" class="w-4 h-4 fill-white mr-1"></i> 67</span>
                    </div>
                </div>
            </div>

            <!-- FOTOĞRAF YERİ 2 -->
            <div class="insta-grid-item" onclick="openModal('shit2.jpg', 'iblis kadar olmasakta iblisiz yani...')">
                <img src="shit2.jpg" alt="Post 2" class="post-img">
                <div class="overlay">
                    <div class="flex space-x-4 text-white font-bold text-sm">
                        <span class="flex items-center"><i data-lucide="heart" class="w-4 h-4 fill-white mr-1"></i> 156</span>
                        <span class="flex items-center"><i data-lucide="message-circle" class="w-4 h-4 fill-white mr-1"></i> 4</span>
                    </div>
                </div>
            </div>

            <!-- FOTOĞRAF YERİ 3 -->
            <div class="insta-grid-item" onclick="openModal('shit3.jpg', 'Sevgi, algıladığımız ama henüz açıklayamadığımız tek şeydir....')">
                <img src="shit3.jpg" alt="Post 3" class="post-img">
                <div class="overlay">
                    <div class="flex space-x-4 text-white font-bold text-sm">
                        <span class="flex items-center"><i data-lucide="heart" class="w-4 h-4 fill-white mr-1"></i> 892</span>
                        <span class="flex items-center"><i data-lucide="message-circle" class="w-4 h-4 fill-white mr-1"></i> 21</span>
                    </div>
                </div>
            </div>

            <!-- FOTOĞRAF YERİ 4 -->
            <div class="insta-grid-item" onclick="openModal('shit4.jpg', 'kumarda karımı ve evimi kaybettim...')">
                <img src="shit4.jpg" alt="Post 4" class="post-img">
                <div class="overlay">
                    <div class="flex space-x-4 text-white font-bold text-sm">
                        <span class="flex items-center"><i data-lucide="heart" class="w-4 h-4 fill-white mr-1"></i> 45</span>
                    </div>
                </div>
            </div>

            <!-- FOTOĞRAF YERİ 5 -->
            <div class="insta-grid-item" onclick="openModal('shit5.jpg', 'Aç kalmak, alçalmaktan daha hayırlıdır. - Hz. Ali')">
                <img src="shit5.jpg" alt="Post 5" class="post-img">
                <div class="overlay">
                    <div class="flex space-x-4 text-white font-bold text-sm">
                        <span class="flex items-center"><i data-lucide="heart" class="w-4 h-4 fill-white mr-1"></i> 1.2k</span>
                    </div>
                </div>
            </div>

            <!-- FOTOĞRAF YERİ 6 -->
            <div class="insta-grid-item" onclick="openModal('shit6.jpg', 'derin düşünceler...')">
                <img src="shit6.jpg" alt="Post 6" class="post-img">
                <div class="overlay">
                    <div class="flex space-x-4 text-white font-bold text-sm">
                        <span class="flex items-center"><i data-lucide="heart" class="w-4 h-4 fill-white mr-1"></i> 67</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal -->
    <div id="photoModal" class="modal" onclick="closeModal()">
        <button class="absolute top-5 right-5 text-white p-2 hover:bg-white/10 rounded-full transition">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        <div class="max-w-4xl w-full bg-black rounded-lg overflow-hidden flex flex-col md:flex-row" onclick="event.stopPropagation()">
            <div class="w-full md:w-2/3 bg-zinc-900 aspect-square flex items-center justify-center relative">
                <img id="modalImg" src="" alt="Shitpost" class="w-full h-full object-contain">
            </div>
            <div class="w-full md:w-1/3 flex flex-col border-l border-zinc-800">
                <div class="p-4 border-b border-zinc-800 flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-zinc-700 overflow-hidden">
                        <img src="WhatsApp Görsel 2025-11-21 saat 20.51.03_4729a496.jpg" alt="P" class="post-img" onerror="this.src='https://ui-avatars.com/api/?name=Nazoc&background=random'">
                    </div>
                    <span class="font-bold text-sm">nazoç_efoç_aytoç_offical</span>
                </div>
                <div class="p-4 flex-1">
                    <p id="modalCaption" class="text-sm">Yükleniyor...</p>
                </div>
                <div class="p-4 border-t border-zinc-800 space-y-3 text-zinc-300">
                    <div class="flex space-x-4">
                        <i data-lucide="heart" class="w-6 h-6"></i>
                        <i data-lucide="message-circle" class="w-6 h-6"></i>
                        <i data-lucide="send" class="w-6 h-6"></i>
                    </div>
                    <p class="text-xs font-bold text-white">1.284 beğenme</p>
                    <p class="text-[10px] text-zinc-500 uppercase">2 SAAT ÖNCE</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobil Menü -->
    <div class="md:hidden fixed bottom-0 w-full bg-black border-t border-zinc-800 flex justify-around py-4 z-50">
        <i data-lucide="home" class="w-6 h-6"></i>
        <i data-lucide="search" class="w-6 h-6"></i>
        <i data-lucide="plus-square" class="w-6 h-6"></i>
        <i data-lucide="play" class="w-6 h-6"></i>
        <div class="w-6 h-6 rounded-full bg-zinc-700 overflow-hidden border border-zinc-600">
             <img src="WhatsApp Görsel 2025-11-21 saat 20.51.03_4729a496.jpg" alt="P" class="post-img" onerror="this.src='https://ui-avatars.com/api/?name=Nazoc'">
        </div>
    </div>

    <script>
        lucide.createIcons();

        function openModal(imgUrl, caption) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');

            modalImg.src = imgUrl;
            modalCaption.innerText = caption;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('photoModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
